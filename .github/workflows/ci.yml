name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hereditus
          POSTGRES_PASSWORD: hereditus
          POSTGRES_DB: hereditus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hereditus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hereditus:hereditus@localhost:5432/hereditus_test
      DJANGO_SETTINGS_MODULE: webapp.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy main_game webapp
      - run: coverage run -m pytest
      - run: coverage report
